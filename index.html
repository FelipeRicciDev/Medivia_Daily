<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escolha seus 8 bichos</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #121212;
      color: #f5f5f5;
      min-height: 100vh;
    }
    .container {
      width: min(1050px, 92%);
      margin: 0 auto;
      padding: 36px 0 60px;
    }
    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: clamp(28px, 4vw, 44px);
    }
    .subtitulo {
      text-align: center;
      color: #cfcfcf;
      margin-bottom: 18px;
    }
    .contador {
      position: sticky;
      top: 12px;
      z-index: 10;
      width: fit-content;
      margin: 0 auto 26px;
      padding: 10px 18px;
      border-radius: 999px;
      background: #2a1641;
      border: 1px solid #7b42b6;
      font-weight: bold;
      box-shadow: 0 8px 26px rgba(0,0,0,.25);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .card {
      position: relative;
      border: 2px solid #333;
      border-radius: 18px;
      background: #1d1d1d;
      min-height: 105px;
      padding: 8px;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease, opacity .15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #7850a6;
    }
    .card img {
      width: 100%;
      max-width: 80px;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      image-rendering: auto;
      border-radius: 12px;
    }
    .card.selecionado {
      border-color: #ffd84d;
      box-shadow: 0 0 0 3px rgba(255,216,77,.18), 0 12px 30px rgba(0,0,0,.3);
    }
    .card.bloqueado {
      opacity: .35;
      cursor: not-allowed;
      transform: none;
    }
    .ordem {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      background: #ffd84d;
      color: #141414;
      font-weight: 800;
      border: 2px solid #fff2a9;
    }
    .card.selecionado .ordem { display: flex; }
    .acoes {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 28px;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 22px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    #verResultado {
      background: #7b42b6;
      color: white;
    }
    #verResultado:disabled {
      opacity: .4;
      cursor: not-allowed;
    }
    #limpar {
      background: #2d2d2d;
      color: white;
      border: 1px solid #444;
    }
    .resultado {
      display: none;
      margin-top: 42px;
      padding: 18px;
      border-radius: 20px;
      background: #19121f;
      border: 1px solid #573274;
    }
    .resultado h2 {
      text-align: center;
      margin-top: 0;
      font-size: 22px;
    }
    .resultado-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(105px, 1fr));
      gap: 10px;
      margin-top: 20px;
    }
    .resultado-item {
      background: #242424;
      border-radius: 16px;
      padding: 8px;
      text-align: center;
      border: 1px solid #3d3d3d;
    }
    .resultado-item img {
      width: 100%;
      max-width: 90px;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      border-radius: 10px;
    }
    .resultado-item strong {
      display: block;
      margin-top: 8px;
      color: #ffd84d;
    }

    @media (max-width: 700px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 430px) {
      .grid { grid-template-columns: 1fr; }
    }

    .aviso {
      text-align: center;
      color: #aaa;
      margin-top: 14px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Escolha seus 8 bichos</h1>
    <p class="subtitulo">Escolha 8 entre os 12 bichos. Ao clicar no 8º, o resultado aparece automaticamente.</p>

    <div class="contador" id="contador">Selecionados: 0 / 8</div>

    <section class="grid" id="grid"></section>

    <div class="acoes">
<button id="limpar">Recomeçar</button>
    </div>

    <section class="resultado" id="resultado">
      <h2>Seu resultado</h2>
      <div class="resultado-grid" id="resultadoGrid"></div>
    </section>
</main>

    ];

    const escolhidos = [];

    const grid = document.getElementById("grid");
    const contador = document.getElementById("contador");
    const limpar = document.getElementById("limpar");
    const resultado = document.getElementById("resultado");
    const resultadoGrid = document.getElementById("resultadoGrid");

    function renderizarOpcoes() {
      grid.innerHTML = "";

      animais.forEach(animal => {
        const card = document.createElement("div");
        const posicao = escolhidos.findIndex(id => id === animal.id);
        const selecionado = posicao !== -1;
        const bloqueado = escolhidos.length >= MAX_ESCOLHAS && !selecionado;

        card.className =
          "card" +
          (selecionado ? " selecionado" : "") +
          (bloqueado ? " bloqueado" : "");

        card.innerHTML = `
          <span class="ordem">${posicao + 1}</span>
          <img src="${animal.imagem}" alt="${animal.nome}">
        `;

        card.addEventListener("click", () => selecionarAnimal(animal.id));
        grid.appendChild(card);
      });

      contador.textContent = `Selecionados: ${escolhidos.length} / ${MAX_ESCOLHAS}`;
}

    function selecionarAnimal(id) {
      const indice = escolhidos.indexOf(id);

      if (indice !== -1) {
        escolhidos.splice(indice, 1);
        resultado.style.display = "none";
        resultadoGrid.innerHTML = "";
      } else {
        if (escolhidos.length >= MAX_ESCOLHAS) return;
        escolhidos.push(id);
      }

      renderizarOpcoes();

      if (escolhidos.length === MAX_ESCOLHAS) {
        mostrarResultado();
      }
    }

    function mostrarResultado() {
      resultadoGrid.innerHTML = "";

      escolhidos.forEach((id, index) => {
        const animal = animais.find(a => a.id === id);
        const item = document.createElement("div");
        item.className = "resultado-item";
        item.innerHTML = `
          <img src="${animal.imagem}" alt="${animal.nome}">
          <strong>Escolha ${index + 1}</strong>
        `;
        resultadoGrid.appendChild(item);
      });

      resultado.style.display = "block";

      setTimeout(() => {
        resultado.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 120);
    }


    limpar.addEventListener("click", () => {
      escolhidos.length = 0;
      resultado.style.display = "none";
      resultadoGrid.innerHTML = "";
      renderizarOpcoes();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    renderizarOpcoes();
  </script>
